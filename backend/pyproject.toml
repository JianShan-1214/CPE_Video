[project]
name = "cpe-video-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "aiosqlite>=0.21.0",
  "fastapi>=0.115.0",
  "greenlet>=3.0.0",
  "httpx>=0.28.0",
  "openai>=2.41.0",
  "pytest>=8.0.0",
  "pytest-anyio>=0.0.0",
  "python-dotenv>=1.2.2",
  "sqlalchemy>=2.0.0",
  "uvicorn>=0.34.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
